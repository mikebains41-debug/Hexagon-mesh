name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "tools/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare embedding models (diagnose fp16, fuse LayerNorm, quantize)
        run: |
          pip install onnx onnxruntime numpy tokenizers
          mkdir -p android/app/src/main/assets
          curl -fL -o /tmp/minilm.onnx https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
          curl -fL -o /tmp/tokenizer.json https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json
          curl -fL -o android/app/src/main/assets/vocab.txt https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/vocab.txt
          python tools/prepare_embed_model.py /tmp/minilm.onnx /tmp/tokenizer.json android/app/src/main/assets

      - name: Generate NPU test model
        run: mkdir -p android/app/src/main/assets && python3 tools/make_npu_test_model.py android/app/src/main/assets/npu_test.onnx

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unpack signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hexagon.p12"
            echo "HM_KEYSTORE_FILE=$RUNNER_TEMP/hexagon.p12" >> "$GITHUB_ENV"
            echo "Signing with the permanent Hexagon Mesh key"
          else
            echo "::warning::No KEYSTORE_B64 secret: this build uses a temporary key and will not install over older builds"
          fi

      - name: Build APK
        working-directory: android
        env:
          HM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle assembleDebug --no-daemon
          if [ -n "$HM_KEYSTORE_FILE" ]; then
            "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" | head -1 || true
          fi

      - name: Publish APK as the "latest" download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hexagon-mesh.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hexagon-mesh.apk --prerelease --title "Latest app build" --notes "Built from commit ${{ github.sha }}"
